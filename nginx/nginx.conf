worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # =========================================================================
    # BƯỚC 5: Cấu hình giới hạn kích thước body request
    # Mặc định của NGINX là 1M. Tăng lên 20M để hỗ trợ upload poster/ảnh
    # =========================================================================
    client_max_body_size 20M;

    # Log format có hiển thị $upstream_addr để kiểm chứng load balancing
    log_format demo_log '$remote_addr - [$time_local] "$request" '
                        '$status Upstream: $upstream_addr '
                        'Client-Real-IP: "$http_x_real_ip"';

    access_log logs/access.log demo_log;
    error_log logs/error.log info;

    # =========================================================================
    # BƯỚC 3: Upstream Cluster định nghĩa nhóm backend servers
    # Mặc định sử dụng thuật toán round-robin (luân phiên)
    # =========================================================================
    upstream cine_backend {
        # least_conn;  # Bật dòng này nếu muốn thuật toán ít kết nối nhất
        server 127.0.0.1:5001 weight=1;
        server 127.0.0.1:5002 weight=1;
    }

    # =========================================================================
    # BƯỚC 1, 2, 5: Server Block HTTP (Port 80)
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name cinemanet.local localhost 127.0.0.1;

        # BƯỚC 1: NGINX làm Web Server phục vụ file tĩnh của Frontend SPA
        location / {
            root html;
            index index.html index.htm;
            # Fallback về index.html cho các route SPA
            try_files $uri $uri/ /index.html;
        }

        # BƯỚC 2: NGINX làm Reverse Proxy chuyển tiếp /api/ đến backend upstream
        location /api/ {
            proxy_pass http://cine_backend;

            # Thiết lập các header quan trọng
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }

    # =========================================================================
    # BƯỚC 6: Server Block HTTPS (Port 443 với chứng chỉ SSL tự ký)
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name cinemanet.local localhost 127.0.0.1;

        # Đường dẫn file chứng chỉ và khóa riêng tư
        ssl_certificate ssl/cinemanet.crt;
        ssl_certificate_key ssl/cinemanet.key;

        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            root html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://cine_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
