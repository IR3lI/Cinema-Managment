# Cấu hình NGINX dành cho môi trường Ubuntu / WSL
# Đặt tại: /etc/nginx/sites-available/cinemanet.conf
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/cinemanet.conf /etc/nginx/sites-enabled/

upstream cine_backend_cluster {
    server 127.0.0.1:5001 weight=1;
    server 127.0.0.1:5002 weight=1;
}

server {
    listen 80;
    server_name cinemanet.local localhost;

    # Giới hạn dung lượng tải lên 20MB
    client_max_body_size 20M;

    # Phục vụ file tĩnh Frontend SPA
    location / {
        root /var/www/cinemanet/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy cho Backend
    location /api/ {
        proxy_pass http://cine_backend_cluster;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name cinemanet.local localhost;

    client_max_body_size 20M;

    ssl_certificate /etc/nginx/ssl/cinemanet.crt;
    ssl_certificate_key /etc/nginx/ssl/cinemanet.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        root /var/www/cinemanet/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://cine_backend_cluster;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
