version: '3.8'

services:
  backend-node1:
    build:
      context: .
      dockerfile: Dockerfile.buoi8
    container_name: cinema-backend-1
    environment:
      - NODE_INSTANCE_ID=Container-Node-1
      - DatabaseProvider=Sqlite
      - ASPNETCORE_URLS=http://+:5000
    networks:
      - cinema-net
    restart: unless-stopped

  backend-node2:
    build:
      context: .
      dockerfile: Dockerfile.buoi8
    container_name: cinema-backend-2
    environment:
      - NODE_INSTANCE_ID=Container-Node-2
      - DatabaseProvider=Sqlite
      - ASPNETCORE_URLS=http://+:5000
    networks:
      - cinema-net
    restart: unless-stopped

  nginx-proxy:
    image: nginx:alpine
    container_name: cinema-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-docker.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend-node1
      - backend-node2
    networks:
      - cinema-net
    restart: unless-stopped

networks:
  cinema-net:
    driver: bridge
